<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 語音數字辨識 (阿拉伯數字版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.5.4/dist/speech-commands.min.js"></script>
    
    <style>
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 500px; }
        h1 { color: #1a73e8; margin-bottom: 10px; }
        #status { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        #current-word { font-size: 6rem; font-weight: bold; color: #4285f4; margin: 20px 0; height: 140px; line-height: 140px; border: 2px dashed #ddd; border-radius: 15px; background-color: #fafafa; }
        .controls { margin-bottom: 30px; }
        button { padding: 12px 24px; font-size: 1rem; cursor: pointer; border: none; border-radius: 8px; margin: 5px; font-weight: bold; transition: all 0.2s; }
        #start-btn { background-color: #34a853; color: white; }
        #stop-btn { background-color: #ea4335; color: white; }
        #clear-btn { background-color: #8e8e8e; color: white; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .history-box { text-align: left; background: #f8f9fa; padding: 15px; border-radius: 10px; border: 1px solid #eee; }
        #history { font-size: 1.5rem; color: #333; word-break: break-all; min-height: 1.5em; letter-spacing: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>數字辨識 (0-9)</h1>
    <div id="status">正在初始化模型...</div>
    <div id="current-word">---</div>
    
    <div class="controls">
        <button id="start-btn" onclick="startListening()" disabled>開始錄音</button>
        <button id="stop-btn" onclick="stopListening()" disabled>停止錄音</button>
        <button id="clear-btn" onclick="clearHistory()">清除紀錄</button>
    </div>

    <div class="history-box">
        <strong>辨識序列：</strong>
        <div id="history">尚未錄取數字</div>
    </div>
</div>

<script>
    let recognizer;
    let fullSequence = []; 
    let lastWord = ""; 
    let lastTime = 0;

    // 1. 定義英文到阿拉伯數字的對照表
    const numberMap = {
        "zero": "0", "one": "1", "two": "2", "three": "3", "four": "4",
        "five": "5", "six": "6", "seven": "7", "eight": "8", "nine": "9"
    };

    window.onload = async () => {
        const status = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        try {
            recognizer = speechCommands.create("BROWSER_FFT");
            await recognizer.ensureModelLoaded();
            status.innerText = "● 系統就緒 (請說英文數字)";
            status.style.color = "#34a853";
            startBtn.disabled = false;
        } catch (err) {
            status.innerText = "❌ 載入失敗: " + err.message;
        }
    };

    async function startListening() {
        const status = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const currentDiv = document.getElementById('current-word');

        startBtn.disabled = true;
        stopBtn.disabled = false;
        status.innerText = "● 正在聆聽中...";
        status.style.color = "#ea4335";

        recognizer.listen(result => {
            const labels = recognizer.wordLabels();
            const maxScoreIndex = result.scores.indexOf(Math.max(...result.scores));
            const word = labels[maxScoreIndex];
            const now = Date.now();

            // 2. 檢查是否在對照表中 (排除 non-numbers)
            if (numberMap.hasOwnProperty(word)) {
                
                // 防止重複觸發邏輯
                const cooldown = (word === lastWord) ? 1500 : 800;

                if (now - lastTime > cooldown) {
                    const digit = numberMap[word]; // 轉換為阿拉伯數字
                    
                    currentDiv.innerText = digit;
                    fullSequence.push(digit);
                    updateHistory();

                    lastWord = word;
                    lastTime = now;
                }
            }
        }, {
            probabilityThreshold: 0.85, 
            overlapFactor: 0.4
        });
    }

    async function stopListening() {
        if (recognizer && recognizer.isListening()) {
            await recognizer.stopListening();
            document.getElementById('start-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('status').innerText = "● 已停止錄音";
            document.getElementById('status').style.color = "#666";
            document.getElementById('current-word').innerText = "---";
            lastWord = "";
        }
    }

    function updateHistory() {
        const historyDiv = document.getElementById('history');
        historyDiv.innerText = fullSequence.length > 0 ? fullSequence.join(" ") : "尚未錄取數字";
    }

    function clearHistory() {
        fullSequence = [];
        lastWord = "";
        updateHistory();
        document.getElementById('current-word').innerText = "---";
    }
</script>

</body>
</html>
